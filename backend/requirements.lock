# Bizz_up backend — fully-pinned lockfile (transitive deps included).
# Generated from pyproject.toml [project.dependencies] on Python 3.12.
# The Dockerfile installs from THIS file (with --no-deps) for reproducible builds.
# Regenerate by resolving the top-level pins in pyproject.toml and freezing.
#
# M4 added google-genai==2.6.0 and its transitive closure: google-auth, requests,
# tenacity, distro, charset-normalizer, urllib3, pyasn1, pyasn1-modules, rsa.
# (anyio/httpx/pydantic/websockets/typing-extensions/sniffio/certifi/idna/cffi/
# cryptography/pycparser were already present and satisfy google-genai's floors.)
# NOTE: google-genai needs pydantic>=2.9.0, satisfied by our pinned 2.10.4; the
# typing-inspection dep only applies to pydantic>=2.11, so it is intentionally
# NOT pinned here.
#
# M11 added google-auth-oauthlib + google-api-python-client (Google Calendar/Meet)
# and their NEW transitive deps: google-api-core, google-auth-httplib2,
# requests-oauthlib, oauthlib, httplib2, uritemplate, pyparsing,
# googleapis-common-protos, proto-plus, protobuf. google-api-core is pinned to
# 2.24.0 — the last line that allows requests>=2.18 (so we keep our existing
# requests==2.32.5; 2.31+ would force requests>=2.33). google-auth/requests/
# certifi/urllib3/pyasn1*/rsa were already present and satisfy their floors.
