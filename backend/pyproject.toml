[project]
name = "bizzup-backend"
version = "0.0.1"
description = "Bizz_up backend — M0+M1 minimal FastAPI app (boots + WhatsApp webhook landing pad)"
requires-python = ">=3.12,<3.13"

# Pinned (==) for reproducible builds. A lockfile (requirements.lock) holds the
# full transitive pin used by the Docker image.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "cryptography==44.0.0",
    "httpx==0.28.1",
    # M4: Google Gemini SDK (the unified google-genai client) for the AI bot
    # builder. Used only when GEMINI_API_KEY is set (validate-at-use).
    "google-genai==2.6.0",
    # M11: Google Calendar + Meet (OPTIONAL per business). google-auth is already
    # present (pulled by google-genai); these add the OAuth-flow helper and the
    # Calendar API client. Used only when a business connects Google + a redirect
    # URI is configured (validate-at-use) — never required at boot.
    "google-auth-oauthlib==1.2.1",
    "google-api-python-client==2.149.0",
    # M16: multipart/form-data parsing. REQUIRED at import time by FastAPI for
    # the POST /internal/wa/media route (File/Form params) — without it FastAPI
    # raises at route registration, so this is a hard dep, not validate-at-use.
    "python-multipart==0.0.20",
    # M16: S3-compatible client for Cloudflare R2 object storage. Imported
    # LAZILY inside services/file_storage.py so the app still boots without it.
    "boto3==1.43.51",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.8.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.models", "app.db", "app.services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
