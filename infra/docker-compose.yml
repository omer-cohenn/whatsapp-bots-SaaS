# Bizz_up — local dev stack (M0 + M1: minimal, bootable plumbing)
# ============================================================================
# Goal of THIS file: one `make dev` brings up the whole stack and you can prove
# a WhatsApp message reaches the backend webhook. No real features yet — just
# the plumbing: backend + gateway + frontend + postgres + redis.
#
# How startup ordering works (NO blind sleeps — this is the B13 fix):
#   - every service has a `healthcheck`
#   - dependents wait with `depends_on: { <svc>: { condition: service_healthy } }`
#   - order:  postgres + redis  →  backend  →  gateway, frontend
#
# Secrets: loaded from ../infra/.env.local (git-ignored). Copy .env.local.example
# to .env.local and fill it in first. The apps FAIL-CLOSED if a required secret
# is missing — there are NO "change-me" defaults anywhere in this file.
#
# IMPORTANT — always pass that env file explicitly so it also feeds the ${VAR}
# interpolation below (e.g. building DATABASE_URL), not just the in-container env:
#     docker compose --env-file infra/.env.local -f infra/docker-compose.yml up --build
# `make dev` already does this for you.
#
# Service-to-service URLs use the compose service NAME (e.g. http://backend:8000),
# never localhost — localhost inside a container is the container itself.
# ============================================================================

name: bizz_up

# ---------------------------------------------------------------------------
# Shared YAML anchors (keep the file DRY; not services themselves)
# ---------------------------------------------------------------------------
x-restart: &restart unless-stopped

services:
  # =========================================================================
  # postgres — the database (plain postgres:16-alpine; light for local + CI).
  # In M2 the migrations/RLS land on top of this. For M0 it just needs to be up
  # and reachable so the backend's /healthz can confirm it.
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    restart: *restart
    # POSTGRES_* are read from .env.local. No defaults: if they're missing the
    # container won't start with a usable role, which is what we want (fail-closed).
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NOT published to the host — avoids "port already allocated" if another
    # Postgres is running on your machine. The backend reaches it privately as
    # postgres:5432 (inside the Docker network). To inspect it from the host,
    # uncomment:  ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready checks the server accepts connections for our role+db.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # =========================================================================
  # redis — the live-chat cache (used for real in M5+). For M0 it just needs to
  # be healthy so the backend can confirm REDIS_URL is reachable.
  # =========================================================================
  redis:
    image: redis:7-alpine
    restart: *restart
    # Require a password (REDIS_PASSWORD from .env.local). --requirepass with an
    # empty value would disable auth, so the apps fail-closed if it's unset.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    environment:
      # The healthcheck runs INSIDE the container, where ${REDIS_PASSWORD} from the
      # env-file is NOT present — that caused the "unhealthy" failure. redis-cli reads
      # REDISCLI_AUTH for the password, so set it here (compose interpolates it).
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # NOT published to the host — your machine already has something on 6379, and
    # the backend reaches this cache privately as  redis:6379  anyway. To inspect
    # it from the host, uncomment (note the different host port):  ports: ["6380:6379"]
    healthcheck:
      # PING must come back +PONG; redis-cli auto-authenticates via REDISCLI_AUTH.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # =========================================================================
  # backend — FastAPI brain (:8000). Owns GET /healthz (200 + checks Postgres
  # and Redis reachable) and the FROZEN webhook  POST /webhook/whatsapp.
  # Built from ./backend (that Dockerfile is the Backend agent's deliverable).
  # =========================================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: *restart
    # All config comes from the environment (fail-closed loader inside the app).
    env_file:
      - ../infra/.env.local
    environment:
      # Inside the network the backend reaches Postgres/Redis by service name.
      # These point DATABASE_URL / REDIS_URL at the compose services so a fresh
      # clone works without hand-editing hosts. (.env.local still supplies the
      # secrets; these just wire the in-network hostnames.)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # GATEWAY_API_TOKEN comes from env_file — the backend uses it to verify the
      # X-Gateway-Token header on every inbound webhook call.
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Mount source for dev convenience (edit-and-reload). node_modules/venv are
      # baked into the image, so we don't shadow them.
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Hit our own /healthz from inside the container. Python is guaranteed
      # present in the backend image; curl/wget may not be, so use urllib.
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz',timeout=3).status==200 else 1)\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # =========================================================================
  # gateway — Node/Baileys WhatsApp gateway (:3000). Owns GET /healthz (200, NO
  # QR / NO secret in it) and forwards inbound WhatsApp messages to the backend
  # webhook. Built from ./gateway (the WhatsApp agent's deliverable).
  # =========================================================================
  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    restart: *restart
    env_file:
      - ../infra/.env.local
    environment:
      # Default the webhook target to the in-network backend URL (the frozen
      # contract path). .env.local may override BACKEND_WEBHOOK_URL, but if it
      # doesn't, this compose default points at the right place.
      BACKEND_WEBHOOK_URL: ${BACKEND_WEBHOOK_URL:-http://backend:8000/webhook/whatsapp}
      # GATEWAY_API_TOKEN comes from env_file — the gateway sends it as the
      # X-Gateway-Token header so the backend can authenticate the call.
      PORT: "3000"
    ports:
      # 3000 published so Omer can open the QR page / hit the gateway in dev.
      - "3000:3000"
    volumes:
      - ../gateway:/app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # node is guaranteed in the gateway image; use it instead of curl/wget.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # =========================================================================
  # frontend — Vite/React dev server (:5173). For M0 it just needs to come up
  # and talk to the backend. Built from ./frontend (the Frontend agent's
  # deliverable). It waits for the backend so the dev proxy has a target.
  # =========================================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: *restart
    env_file:
      - ../infra/.env.local
    environment:
      # The browser talks to the backend on the HOST (localhost:8000), not the
      # in-network name — this is the URL baked into the dev build for the proxy.
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
      PORT: "5173"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      # Keep the image's LINUX-installed node_modules from being shadowed by the
      # host's WINDOWS node_modules (that mismatch crashed Vite/rollup). The
      # anonymous volume below "wins" over the bind mount for this path.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Vite serves the SPA on 5173; a 200 on / means the dev server is up.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://localhost:5173/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

# ---------------------------------------------------------------------------
# Named volumes — durable Postgres data across `make down`/`make dev`.
# (Redis is intentionally ephemeral here: it's a cache, not a store of record.)
# ---------------------------------------------------------------------------
volumes:
  pg_data:

# Default network is created automatically; all services share it and resolve
# each other by service name (backend, gateway, frontend, postgres, redis).
