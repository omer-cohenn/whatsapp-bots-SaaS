# Bizz_up — PRODUCTION networking OVERRIDE.
# ============================================================================
# Use ON TOP of the base file, never alone:
#     docker compose --env-file infra/.env \
#       -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d
#
# What this override changes vs. the dev base:
#   1. Adds a single `reverse-proxy` (Caddy) — the ONLY service with published
#      host ports (80/443). It fronts the static frontend + /api + /auth.
#   2. REMOVES the host `ports:` from backend, gateway, and frontend (via the
#      `!override []` reset tag) so NOTHING but the proxy is reachable from the
#      host. postgres/redis/migrate never published ports to begin with.
#   3. Swaps the frontend from the Vite dev server (source bind-mount) to a
#      pre-built STATIC image (frontend/Dockerfile.prod), internal-only.
#   4. Drops the dev source bind-mounts on backend/frontend so each runs the
#      code baked into its image, and sets APP_ENV=prod on the backend (which
#      turns OFF /docs, /redoc, /openapi.json — see app/main.py).
#
# See docs/security/production-networking.md for the full public-vs-internal map.
# `!override` / `!reset` require Docker Compose v2.24+ (Compose Specification).
# ============================================================================

services:
  # ---- the ONLY public service ---------------------------------------------
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      # Set to your real domain for automatic HTTPS on :443. Unset -> plain :80
      # (use when TLS is terminated upstream by an ALB/CloudFront).
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # M20 — the gallery images, READ-ONLY. Caddy serves them as static files at
      # /media/* so image traffic never enters FastAPI (the 1 GB box cannot
      # afford to stream photos through Python). `:ro` because the proxy has no
      # business writing here — only the backend does.
      - business_images:/srv/business-images:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ---- backend: internal only, prod env, no source mount -------------------
  backend:
    # Remove the published host port — reachable only via the proxy / internal net.
    ports: !override []
    # Run the code baked into the image, not a host bind-mount.
    #
    # ⚠️ `!override` REPLACES the base list — it does not merge. Dropping the dev
    # source bind-mount therefore also drops the base file's business_images
    # volume, so it MUST be restated here. If it is ever removed from this list,
    # the backend writes gallery photos into the container's own filesystem and
    # every deploy silently deletes all of them (this is the M19 Redis failure
    # again — see infra/docker-compose.yml). Keep this line.
    volumes: !override
      - business_images:/data/business-images
    environment:
      # Turns OFF /docs, /redoc, /openapi.json (see create_app in app/main.py).
      APP_ENV: prod

  # ---- gateway: internal only, run the baked image (not a source mount) ----
  gateway:
    ports: !override []
    # Drop the dev source bind-mount so the container uses the node_modules baked
    # into its image (otherwise the mount shadows them → "Cannot find module").
    volumes: !override []

  # ---- frontend: pre-built STATIC image, internal only ---------------------
  frontend:
    build:
      # context (../frontend) is inherited from the base; swap the Dockerfile.
      dockerfile: Dockerfile.prod
    # No host port and no source bind-mount — a static build served internally.
    ports: !override []
    volumes: !override []
    # The static image serves on :80, not the Vite dev port 5173.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  caddy_data:
  caddy_config:
  # Declared in the base file too; restated so this override can reference it.
  business_images:
